<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Never Sleep</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <img class="logo" src="../assets/logo.jpg" alt="Never Sleep">
  <h1 class="brand">Never <span>Sleep</span></h1>
  <p class="tagline">طول ما منع السكون شغال، اللابتوب مش هينام.</p>

  <div class="card status-card">
    <div class="status-row">
      <div>
        <div class="status-label">منع السكون</div>
        <div class="status-text" id="statusText">متوقف</div>
      </div>
      <button class="switch" id="mainToggle" role="switch" aria-checked="false" aria-label="منع السكون">
        <span class="knob"></span>
      </button>
    </div>
    <div class="countdown" id="countdown" hidden>متبقي <b id="remaining"></b></div>
    <div class="paused" id="paused" hidden>متوقف مؤقتًا لأنك على البطارية — هيرجع يشتغل أول ما توصل الشاحن.</div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="row-label">إبقاء الشاشة شغالة كمان</div>
        <div class="row-sub">الشاشة متتضلمش طول ما منع السكون شغال</div>
      </div>
      <button class="switch small" id="screenToggle" role="switch" aria-checked="false" aria-label="إبقاء الشاشة شغالة">
        <span class="knob"></span>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="row-label">المدة</div>
    <div class="chips" id="chips">
      <button class="chip" data-min="0">حتى الإيقاف</button>
      <button class="chip" data-min="60">ساعة</button>
      <button class="chip" data-min="120">ساعتين</button>
      <button class="chip" data-min="240">٤ ساعات</button>
    </div>
    <div class="custom-row">
      <span class="custom-label">أو مدة مخصصة:</span>
      <input type="number" id="custH" class="num" min="0" max="99" value="0" inputmode="numeric">
      <span class="custom-unit">ساعة</span>
      <input type="number" id="custM" class="num" min="0" max="59" value="30" inputmode="numeric">
      <span class="custom-unit">دقيقة</span>
      <button class="chip apply" id="custApply">اضبط</button>
    </div>
    <div class="row check-row">
      <label class="check">
        <input type="checkbox" id="acOnly">
        <span class="box"></span>
        <span>على الشاحن بس — يوقّف لو فصلت الشاحن عشان يحافظ على البطارية</span>
      </label>
    </div>
    <div class="row check-row">
      <label class="check">
        <input type="checkbox" id="autoStart">
        <span class="box"></span>
        <span>تشغيل تلقائي مع ويندوز (يفتح جنب الساعة)</span>
      </label>
    </div>
  </div>

  <div class="actions">
    <button class="btn ghost" id="minBtn">تصغير جنب الساعة</button>
    <button class="btn danger" id="exitBtn">إيقاف وخروج</button>
  </div>
  <p class="hint">البرنامج بيفتح متوقف، وبييفتكر اختياراتك لما تشغّله.</p>

  <div class="contacts">
    <button class="contact" id="waBtn">
      <svg viewBox="0 0 24 24" class="ic wa"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.6-1.3.1-.2 0-.4 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.9.9-1.1 2.2-.2 3.9a11.6 11.6 0 0 0 4.5 4.2c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2 0-.1-.2-.2-.4-.3z"/></svg>
      <span class="c-name">Ahmed Roza</span>
      <span class="c-tap">اضغط</span>
    </button>
    <button class="contact" id="igBtn">
      <svg viewBox="0 0 24 24" class="ic ig"><path fill="currentColor" d="M12 2.2c3.2 0 3.6 0 4.9.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.9.1s-3.6 0-4.9-.1c-3.3-.1-4.8-1.7-4.9-4.9-.1-1.3-.1-1.6-.1-4.8s0-3.6.1-4.8C2.4 4 4 2.4 7.2 2.3c1.2-.1 1.6-.1 4.8-.1zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zm5.2-9.6a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>
      <span class="c-name">ahmed_roza_</span>
      <span class="c-tap">اضغط</span>
    </button>
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
